plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.omnidoc.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.omnidoc.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs out-of-the-box
            // without you having to create a keystore. Perfect for personal use.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // PDF engine (open / edit pages / search / outline) - Apache 2.0
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"

    // DOCX round-trip helpers: HTML parsing for the Word serializer
    implementation "org.jsoup:jsoup:1.18.1"

    // Markdown preview
    implementation "io.noties:markwon:4.6.2"

    // Recents persistence
    implementation "com.google.code.gson:gson:2.10.1"
}
